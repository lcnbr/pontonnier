name: Build and deploy Typst website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read compiler version
        id: typst
        run: echo "version=$(cat .typst-version)" >> "$GITHUB_OUTPUT"
      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: ${{ steps.typst.outputs.version }}
      - name: Check root deployment
        run: |
          ./scripts/build.sh
          python3 scripts/check.py
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build deployment artifact
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            export BASE_PATH="/$REPOSITORY_NAME/"
          else
            export BASE_PATH="${PAGES_BASE%/}/"
          fi
          ./scripts/build.sh
          python3 scripts/check.py --base-path "$BASE_PATH"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
